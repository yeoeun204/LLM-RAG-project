<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤형 학습 진단 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; }
        h1 { text-align: center; color: #2c3e50; font-size: 28px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 4px solid #3498db; }
        .step-title { color: #2c3e50; margin-top: 0; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        input[type="file"], input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; background-color: #f9f9f9; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .result-box { background-color: #e8f4fd; padding: 15px; border-radius: 6px; margin-top: 15px; min-height: 40px; font-size: 14px; white-space: pre-wrap; line-height: 1.5; color: #1a5276; }
        .danger-box { background-color: #fdedec; color: #c0392b; border-left: 5px solid #c0392b; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 AI 맞춤형 학습 진단 (버전 3.0 동적 융합)</h1>

    <div class="card" id="step1">
        <div class="step-title">1. 강의 파일 입력</div>
        <p style="font-size: 14px; color: #666;">학습할 강의 자료(PDF 등)를 업로드해주세요.</p>
        <input type="number" id="userId" placeholder="사용자 번호 (예: 1)" value="1">
        <input type="file" id="fileInput">
        <button onclick="uploadMaterial()">업로드 및 지식 학습하기</button>
        <div id="uploadResult" class="result-box hidden"></div>
    </div>

    <div class="card hidden" id="step2">
        <div class="step-title">2. 퀴즈 생성 및 풀이</div>
        <p style="font-size: 14px; color: #666;">AI가 지식 그래프를 바탕으로 퀴즈를 출제합니다.</p>
        <button id="generateBtn" onclick="generateQuiz()">맞춤형 퀴즈 출제받기</button>
        <div id="quizResult" class="result-box hidden" style="background-color: transparent; padding: 0;"></div>
    </div>

    <div class="card hidden" id="step3">
        <div class="step-title">3. 채점 결과 및 AI 심층 피드백</div>
        <div id="feedbackResult" class="result-box">결과를 분석 중입니다...</div>
    </div>
</div>

<script>
    // 🚨 본인의 Render 서버 주소로 반드시 확인/수정해주세요!
    const BASE_URL = "https://llm-rag-project.onrender.com";

    let currentLectureId = null;
    let questionStartTime = 0; 
    let currentQuestionText = "";
    let currentCorrectAnswer = "";
    let currentKeywords = [];
    let currentExplanation = "";

    // ==========================================
    // [1단계] 파일 업로드
    // ==========================================
    async function uploadMaterial() {
        const fileInput = document.getElementById('fileInput').files[0];
        const userId = document.getElementById('userId').value;
        const resultBox = document.getElementById('uploadResult');

        if (!fileInput) {
            alert("파일을 선택해주세요!");
            return;
        }

        resultBox.classList.remove('hidden');
        resultBox.innerText = "열심히 자료를 읽고 지식 구조를 파악하는 중입니다...\n(서버 상태에 따라 1~2분 소요될 수 있습니다)";

        const formData = new FormData();
        formData.append("file", fileInput);

        try {
            const response = await fetch(BASE_URL + "/api/v1/materials?user_id=" + userId, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            
            currentLectureId = data.lecture_id; 
            resultBox.innerText = "✅ 학습 완료! (자료 번호: " + currentLectureId + ")\n아래에서 퀴즈를 출제받으세요.";
            document.getElementById('step2').classList.remove('hidden');
        } catch (error) {
            resultBox.innerText = "에러 발생: 서버가 잠들어있을 수 있습니다. 잠시 후 다시 시도해주세요.";
        }
    }

    // ==========================================
    // [2단계] 동적 퀴즈 받아오기 (JSON 방식)
    // ==========================================
    async function generateQuiz() {
        const resultBox = document.getElementById('quizResult');
        const btn = document.getElementById('generateBtn');
        
        resultBox.classList.remove('hidden');
        resultBox.innerHTML = "<div style='padding:15px; background:#f9f9f9; border-radius:8px;'>AI 조교가 맞춤형 퀴즈를 생성하는 중입니다... ⏳</div>";
        btn.disabled = true;

        try {
            const response = await fetch(BASE_URL + "/api/v1/materials/" + currentLectureId + "/quiz");
            const data = await response.json();
            
            if(data.quiz_data && data.quiz_data.question) {
                // 💡 더 이상 텍스트를 자르지 않습니다! JSON에서 바로 빼옵니다.
                currentQuestionText = data.quiz_data.question;
                currentCorrectAnswer = data.quiz_data.correct_answer;
                currentKeywords = data.quiz_data.required_keywords;
                currentExplanation = data.quiz_data.explanation;
                
                showQuestion();
                btn.style.display = 'none'; 
            } else {
                resultBox.innerHTML = "퀴즈를 불러오지 못했습니다. 파일 내용이 너무 길어 AI가 시간 초과되었을 수 있습니다.";
                btn.disabled = false;
            }
        } catch (error) {
            resultBox.innerHTML = "에러 발생: " + error;
            btn.disabled = false;
        }
    }

    // ==========================================
    // [화면 렌더링] 한 문제 띄우기
    // ==========================================
    function showQuestion() {
        const displayArea = document.getElementById("quizResult"); 
        document.getElementById('step3').classList.add('hidden');
        questionStartTime = Date.now(); 

        displayArea.innerHTML = `
            <div style="background-color: white; border-radius: 8px; padding: 25px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <h3 style="color: #2c3e50; margin-top: 0;">📝 맞춤형 심층 퀴즈</h3>
                <pre style="white-space: pre-wrap; font-family: inherit; font-size: 16px; line-height: 1.6; color: #333; margin-bottom:0;">${currentQuestionText}</pre>
                
                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ccc; display: flex; flex-direction: column; gap: 10px;">
                    <textarea id="interactiveUserAnswer" placeholder="서술형으로 정답과 논리를 입력해주세요." style="width: 100%; height: 80px; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; resize: none;"></textarea>
                    <button onclick="submitInteractiveAnswer()" style="padding: 12px 25px; cursor: pointer; background-color: #e67e22; color: white; border: none; border-radius: 5px; font-size: 16px;">제출 및 하이브리드 채점 🚀</button>
                </div>

                <div id="interactiveFeedbackBox" style="display: none; margin-top: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 8px; border-left: 5px solid #ccc;">
                    <p style="margin-bottom:10px; font-size:15px;"><strong>💡 모범 정답:</strong> <span id="interactiveCorrectText" style="color:#2980b9;"></span></p>
                    <p style="margin-bottom:0; font-size:14px; color:#555;"><strong>📖 해설:</strong> <span id="interactiveExplanationText"></span></p>
                </div>
            </div>
        `;
    }

    // ==========================================
    // [3단계] 채점 요청 및 UI 결과 통제
    // ==========================================
    async function submitInteractiveAnswer() {
        const userAnswerInput = document.getElementById("interactiveUserAnswer");
        const userAnswer = userAnswerInput.value.trim();
        
        if (!userAnswer) {
            alert("답안을 작성해주세요!");
            return;
        }

        // 중복 클릭 방지
        userAnswerInput.disabled = true; 

        // 숨겨둔 해설 창 열기
        const feedbackBox = document.getElementById("interactiveFeedbackBox");
        document.getElementById("interactiveCorrectText").innerText = currentCorrectAnswer;
        document.getElementById("interactiveExplanationText").innerText = currentExplanation;
        feedbackBox.style.display = "block";

        const timeTakenSeconds = (Date.now() - questionStartTime) / 1000;
        
        const step3Box = document.getElementById('step3');
        const feedbackResult = document.getElementById('feedbackResult');
        step3Box.classList.remove('hidden');
        feedbackResult.className = 'result-box'; // 초기화
        feedbackResult.innerText = "제출 완료! (소요 시간: " + Math.round(timeTakenSeconds) + "초)\n조원의 하이브리드 알고리즘(유사도+키워드+위계)이 분석 중입니다... 🤖";

        // 💡 백엔드로 보낼 핵심 데이터 패키지 (숨겨둔 정답과 키워드 포함)
        const requestBody = {
            lecture_id: currentLectureId || 1, // 백엔드 Pydantic 에러 방지용 기본값
            question_text: currentQuestionText,
            user_answer: userAnswer,
            time_taken_seconds: timeTakenSeconds,
            correct_answer: currentCorrectAnswer,
            required_keywords: currentKeywords,
            explanation: currentExplanation
        };

        try {
            const response = await fetch(BASE_URL + "/api/v1/quiz/grade", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            
            // 백엔드가 판별한 상태(System Decision)에 따라 박스 색상 다르게 칠하기
            if (data.system_decision.includes("위험도 점수")) {
                if (data.final_danger_score >= 0.5) {
                    // 심각한 오개념 (ERROR)
                    feedbackResult.style.backgroundColor = '#fdedec';
                    feedbackResult.style.color = '#c0392b';
                    feedbackResult.style.borderLeft = '5px solid #c0392b';
                } else {
                    // 단순 실수 (WARNING)
                    feedbackResult.style.backgroundColor = '#fff3cd';
                    feedbackResult.style.color = '#856404';
                    feedbackResult.style.borderLeft = '5px solid #ffeeba';
                }
            } else {
                // 완벽한 정답 (MASTERED)
                feedbackResult.style.backgroundColor = '#d4edda';
                feedbackResult.style.color = '#155724';
                feedbackResult.style.borderLeft = '5px solid #c3e6cb';
            }

            // 최종 피드백 텍스트 결합해서 띄우기
            feedbackResult.innerText = 
                "📊 [시스템 진단 결과]\n" + data.system_decision + "\n\n" +
                data.ai_feedback;

        } catch (error) {
            feedbackResult.innerText = "심층 오답 분석 중 예기치 못한 통신 에러가 발생했습니다.";
        }
    }
</script>

</body>
</html>
