<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤형 학습 진단 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; }
        h1 { text-align: center; color: #2c3e50; font-size: 28px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 4px solid #3498db; }
        .step-title { color: #2c3e50; margin-top: 0; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        input[type="file"], input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; background-color: #f9f9f9; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .result-box { background-color: #e8f4fd; padding: 15px; border-radius: 6px; margin-top: 15px; min-height: 40px; font-size: 14px; white-space: pre-wrap; line-height: 1.5; color: #1a5276; }
        .danger-box { background-color: #fdedec; color: #c0392b; border-left: 5px solid #c0392b; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 AI 맞춤형 학습 진단 (사용자용)</h1>

    <div class="card" id="step1">
        <div class="step-title">1. 강의 파일 입력</div>
        <p style="font-size: 14px; color: #666;">학습할 강의 자료(PDF 등)를 업로드해주세요.</p>
        <input type="number" id="userId" placeholder="사용자 번호 (예: 1)" value="1">
        <input type="file" id="fileInput">
        <button onclick="uploadMaterial()">업로드 및 지식 학습하기</button>
        <div id="uploadResult" class="result-box hidden"></div>
    </div>

    <div class="card hidden" id="step2">
        <div class="step-title">2. 퀴즈 생성 및 풀이</div>
        <p style="font-size: 14px; color: #666;">AI가 지식 그래프를 바탕으로 퀴즈를 출제합니다.</p>
        <button id="generateBtn" onclick="generateQuiz()">맞춤형 퀴즈 출제받기</button>
        
        <div id="quizResult" class="result-box hidden" style="background-color: transparent; padding: 0;"></div>
    </div>

    <div class="card hidden" id="step3">
        <div class="step-title">3. 채점 결과 및 AI 심층 피드백</div>
        <div id="feedbackResult" class="result-box">결과를 분석 중입니다...</div>
    </div>
</div>

<script>
    // 렌더 서버 주소 연결 완료!
    const BASE_URL = "https://llm-rag-project.onrender.com";

    let currentLectureId = null;
    let questionStartTime = 0; 
    let currentCorrectAnswer = "";
    let currentExplanation = "";
    let currentQuestionText = "";
    let quizArray = [];
    let currentIndex = 0;

    // ==========================================
    // [1단계] 파일 업로드 및 지식 학습
    // ==========================================
    async function uploadMaterial() {
        const fileInput = document.getElementById('fileInput').files[0];
        const userId = document.getElementById('userId').value;
        const resultBox = document.getElementById('uploadResult');

        if (!fileInput) {
            alert("파일을 선택해주세요!");
            return;
        }

        resultBox.classList.remove('hidden');
        resultBox.innerText = "열심히 자료를 읽고 지식 구조를 파악하는 중입니다...\n(서버 상태에 따라 1~2분 소요될 수 있습니다)";

        const formData = new FormData();
        formData.append("file", fileInput);

        try {
            const response = await fetch(BASE_URL + "/api/v1/materials?user_id=" + userId, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            
            currentLectureId = data.lecture_id; 
            resultBox.innerText = "✅ 학습 완료! (자료 번호: " + currentLectureId + ")\n아래에서 퀴즈를 출제받으세요.";
            
            document.getElementById('step2').classList.remove('hidden');
        } catch (error) {
            resultBox.innerText = "에러 발생: 서버가 잠들어있을 수 있습니다. 잠시 후 다시 시도해주세요.";
        }
    }

    // ==========================================
    // [2단계] 퀴즈 생성 버튼 클릭 시
    // ==========================================
    async function generateQuiz() {
        const resultBox = document.getElementById('quizResult');
        const btn = document.getElementById('generateBtn');
        
        resultBox.classList.remove('hidden');
        resultBox.innerHTML = "<div style='padding:15px; background:#f9f9f9; border-radius:8px;'>AI 조교가 맞춤형 퀴즈를 생성하는 중입니다... ⏳</div>";
        btn.disabled = true;

        try {
            const response = await fetch(BASE_URL + "/api/v1/materials/" + currentLectureId + "/quiz");
            const data = await response.json();
            
            if(data.quiz_data) {
                // 백엔드에서 온 퀴즈 텍스트를 대화형 함수로 넘김!
                const rawQuizText = data.quiz_data.join("\n");
                startInteractiveQuiz(rawQuizText);
                btn.style.display = 'none'; // 퀴즈가 시작되면 생성 버튼은 숨김
            } else {
                resultBox.innerHTML = "퀴즈를 불러오지 못했습니다.";
                btn.disabled = false;
            }
        } catch (error) {
            resultBox.innerHTML = "에러 발생: " + error;
            btn.disabled = false;
        }
    }

    // ==========================================
    // [대화형 퀴즈 엔진] 텍스트 쪼개고 화면에 그리기
    // ==========================================
    function startInteractiveQuiz(rawQuizText) {
        // "Q1.", "Q2." 기준으로 쪼개기
        quizArray = rawQuizText.split(/Q\d+\./).filter(text => text.trim() !== "");
        currentIndex = 0; 
        showQuestion(currentIndex);
    }

    function showQuestion(index) {
        const displayArea = document.getElementById("quizResult"); 
        
        // 문제 넘어갈 때 3단계 피드백 창은 다시 숨겨두기
        document.getElementById('step3').classList.add('hidden');

        // 모든 문제를 다 풀었을 때
        if (index >= quizArray.length) {
            displayArea.innerHTML = `
                <div style='text-align:center; padding: 30px; background: white; border-radius: 8px;'>
                    <h2 style='color: #28a745;'>🎉 모든 퀴즈를 완료했습니다!</h2>
                    <p>정말 수고하셨습니다
